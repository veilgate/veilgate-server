<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="5">
  <title>VeilGate 대시보드</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap">
  <link rel="stylesheet" th:href="@{/css/guard.css}">
</head>
<body>
<header class="top">
  <div class="inner">
    <a class="logo" th:href="@{/}">
      <img th:src="@{/img/veilgate-256.png}" alt="VeilGate">
      <span class="name">VeilGate</span>
      <span class="tag">AI Privacy Gateway</span>
    </a>
    <nav class="tabs">
      <a th:href="@{/}">데모</a>
      <a class="on" th:href="@{/dashboard}">관리자 대시보드</a>
    </nav>
  </div>
</header>

<main>
  <div class="kpis">
    <div class="kpi total"><div class="label">처리한 요청</div><div class="value" th:text="${totalCount}">0</div></div>
    <div class="kpi mask"><div class="label">보호한 개인정보</div><div class="value" th:text="${protectedTotal}">0</div></div>
    <div class="kpi"><div class="label">외부로 나간 개인정보</div><div class="value" th:text="${leakedTotal}">0</div></div>
    <div class="kpi drop"><div class="label">지금 저장소에 남은 치환 값</div><div class="value" th:text="${vaultRemaining}">0</div></div>
  </div>

  <div class="card">
    <h2>요청 기록 <span class="muted">원래 값은 저장하지 않고, 종류와 개수만 남깁니다 · 5초마다 새로고침</span></h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th>시각</th><th>경로</th><th>결과</th><th>보호한 개인정보</th><th>파기</th><th>외부 AI</th><th>탐지</th><th>시간</th></tr></thead>
        <tbody>
          <tr th:each="r : ${records}">
            <td class="mono" th:text="${#temporals.format(r.requestedAt, 'HH:mm:ss')}"></td>
            <td th:text="${r.channel}"></td>
            <td>
              <span class="pill block" th:if="${r.blocked}" th:title="${r.blockReason}">차단</span>
              <span class="pill ok" th:unless="${r.blocked}">보호 후 전송</span>
            </td>
            <td>
              <div class="policy">
                <span class="pill mask" th:each="c : ${r.protectedCounts}" th:text="${c.type.label + ' ' + c.count}"></span>
                <span class="muted" th:if="${r.protectedCounts.isEmpty()}">없음</span>
              </div>
            </td>
            <td class="mono" th:text="${r.blocked ? '-' : r.destroyedCount + '개'}"></td>
            <td class="muted" th:text="${r.blocked ? '-' : (r.usedExternalLlm ? r.externalModel : '연결 실패')}"></td>
            <td class="muted" th:text="${r.usedLocalLlm ? '로컬 LLM' : '예비 사전'}"></td>
            <td class="mono" th:text="${r.elapsedMillis + 'ms'}"></td>
          </tr>
          <tr th:if="${records.isEmpty()}"><td colspan="8" class="muted">아직 요청이 없습니다. 데모 화면에서 보내 보세요.</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>
</body>
</html>
